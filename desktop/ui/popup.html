<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SiftKit Assistant</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: #1d2733;
        color: #e8edf2;
        padding: 12px 14px;
      }
      h1 { font-size: 13px; margin: 0 0 6px; color: #9fb3c8; font-weight: 600; }
      p#question { font-size: 14px; margin: 0 0 10px; }
      textarea { width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #3a4a5c;
        background: #141c26; color: inherit; padding: 6px; font: inherit; resize: none; }
      .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
      button { border: 1px solid #3a4a5c; background: #24303e; color: inherit; border-radius: 6px;
        padding: 5px 12px; cursor: pointer; font-size: 12px; }
      button.primary { background: #1f6fba; border-color: #1f6fba; }
      #error { color: #ff9e9e; font-size: 12px; margin: 6px 0 0; min-height: 14px; }
      details { margin-left: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>SiftKit Assistant asks</h1>
    <p id="question"></p>
    <textarea id="answer" rows="2" aria-label="Your answer"></textarea>
    <p id="error"></p>
    <div class="row">
      <button class="primary" id="submit">Answer</button>
      <button id="skip">Skip</button>
      <button id="snooze">Snooze</button>
      <details>
        <summary>More</summary>
        <button id="do-not-repeat">Don't ask again</button>
        <button id="stop-topic">Stop this topic</button>
      </details>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
