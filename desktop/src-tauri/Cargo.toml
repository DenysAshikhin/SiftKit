[package]
name = "siftkit-assistant-shell"
version = "0.1.0"
description = "SiftKit Assistant desktop shell: tray, observation adapters, capture, custody"
edition = "2021"

[lib]
name = "siftkit_assistant_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
base64 = "0.22"
regex = "1"
ureq = { version = "2", features = ["json"] }
zeroize = "1"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Security_Cryptography",
  "Win32_Storage_Xps",
  "Win32_System_JobObjects",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
strip = true
