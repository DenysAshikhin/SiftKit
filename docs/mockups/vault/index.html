<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SiftKit · Memory vault — mockup</title>
<style>
:root {
  --bg: #0e141b; --panel: #121a23; --panel2: #0b1118; --ink: #dfe9f3; --dim: #879bb0; --line: #223040;
  --acc: #2fbfa0; --ok: #4fca8f; --bad: #ef7d7d; --run: #e6b566; --sky: #9cd6ff; --code: #b9cbdd;
  --hover: #141e29; --track: #1a2634;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #1f2c3a; border-radius: 6px; border: 2px solid var(--bg); }

#app { display: grid; grid-template-rows: 40px 1fr 26px; height: 100vh; }

/* ---- dashboard top bar (shows the vault embedded as the Memory tab) */
.topbar { display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.brand { font-weight: 700; margin-right: 18px; letter-spacing: .02em; }
.brand b { color: var(--acc); }
.topbar .tab { padding: 6px 12px; border-radius: 7px; color: var(--dim); border: 0; background: none; }
.topbar .tab.active { color: var(--ink); background: var(--track); }
.topbar .spacer { flex: 1; }
.mock-flag { font-size: 11px; color: var(--run); border: 1px solid #5a4a2a; padding: 2px 8px; border-radius: 99px; }

/* ---- three-column vault */
.vault { display: grid; grid-template-columns: 44px 270px 1fr 320px; min-height: 0; }
.ribbon { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-right: 1px solid var(--line); background: var(--panel2); }
.ribbon button { width: 32px; height: 32px; border: 0; border-radius: 7px; background: none; color: var(--dim); font-size: 15px; display: grid; place-items: center; }
.ribbon button:hover, .ribbon button.active { background: var(--track); color: var(--ink); }
.ribbon .grow { flex: 1; }

.left, .right { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.left { border-right: 1px solid var(--line); }
.right { border-left: 1px solid var(--line); }
.pane-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px 6px; }
.pane-head h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); flex: 1; }
.icon-btn { border: 0; background: none; color: var(--dim); border-radius: 6px; padding: 2px 6px; }
.icon-btn:hover { background: var(--track); color: var(--ink); }
.search { margin: 0 10px 8px; position: relative; }
.search input { width: 100%; padding: 6px 9px 6px 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); outline: none; }
.search input:focus { border-color: var(--acc); }
.search::before { content: "⌕"; position: absolute; left: 9px; top: 5px; color: var(--dim); }
.scroll { overflow: auto; min-height: 0; flex: 1; }

.tree { padding: 0 6px 14px; user-select: none; }
.tree .row { display: flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 5px; color: var(--code); cursor: pointer; white-space: nowrap; overflow: hidden; }
.tree .row:hover { background: var(--hover); }
.tree .row.active { background: #17302b; color: var(--ink); }
.tree .row .chev { width: 10px; color: var(--dim); font-size: 9px; flex: none; }
.tree .row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tree .row .count { color: var(--dim); font-size: 11px; }
.tree .row.folder { color: var(--ink); }
.tree .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.tree .more { padding: 2px 6px 2px 28px; color: var(--dim); font-size: 11px; cursor: pointer; }
.tree .more:hover { color: var(--ink); }
.tree-sec { padding: 10px 8px 3px; font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
.tree .ico { width: 16px; text-align: center; font-size: 12px; flex: none; }

.results .hit { padding: 6px 12px; border-bottom: 1px solid #18222e; cursor: pointer; }
.results .hit:hover { background: var(--hover); }
.results .hit .t { font-weight: 600; }
.results .hit .p { color: var(--dim); font-size: 11px; }
.results .hit .s { color: var(--code); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
mark { background: #3b5b2c; color: var(--ink); border-radius: 2px; padding: 0 1px; }
.results .summary { padding: 4px 12px 8px; color: var(--dim); font-size: 11px; }

.tags { padding: 4px 12px 14px; display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel2); color: var(--code); font-size: 11px; cursor: pointer; }
.chip:hover { border-color: var(--acc); }
.chip small { color: var(--dim); }

/* ---- center */
.center { display: grid; grid-template-rows: 34px 1fr; min-width: 0; min-height: 0; }
.tabbar { display: flex; align-items: end; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--panel2); overflow-x: auto; }
.tabbar .t { display: flex; align-items: center; gap: 6px; max-width: 220px; padding: 6px 10px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; color: var(--dim); cursor: pointer; white-space: nowrap; }
.tabbar .t span { overflow: hidden; text-overflow: ellipsis; }
.tabbar .t.active { background: var(--bg); border-color: var(--line); color: var(--ink); margin-bottom: -1px; }
.tabbar .t .x { border: 0; background: none; color: var(--dim); padding: 0 2px; border-radius: 4px; }
.tabbar .t .x:hover { background: var(--track); color: var(--ink); }
.view { overflow: auto; min-height: 0; position: relative; }

.note { max-width: 860px; margin: 0 auto; padding: 22px 34px 80px; }
.crumbs { color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.crumbs .sep { opacity: .5; }
.note-head { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
.note-head h1 { margin: 0; font-size: 26px; line-height: 1.2; flex: 1; outline: none; border-radius: 6px; }
.note-head h1[contenteditable="true"] { box-shadow: 0 0 0 1px var(--acc); padding: 0 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 3px 10px; color: var(--dim); }
.seg button.on { background: var(--track); color: var(--ink); }

.props { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); margin: 0 0 18px; }
.props summary { padding: 6px 12px; color: var(--dim); font-size: 12px; cursor: pointer; }
.props table { width: 100%; border-collapse: collapse; font-size: 12px; }
.props td { padding: 4px 12px; border-top: 1px solid #18222e; vertical-align: top; }
.props td:first-child { color: var(--dim); width: 120px; white-space: nowrap; }
.props .chip { margin: 0 4px 3px 0; cursor: default; }

.md h2 { font-size: 16px; margin: 22px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #18222e; }
.md h3 { font-size: 14px; margin: 16px 0 4px; }
.md ul { margin: 4px 0; padding-left: 22px; }
.md li { margin: 1px 0; }
.md li.unverified { color: var(--dim); }
.md li .actions { visibility: hidden; margin-left: 6px; }
.md li:hover .actions { visibility: visible; }
.md li .actions button { border: 1px solid var(--line); background: var(--panel2); border-radius: 5px; font-size: 11px; padding: 0 6px; margin-right: 3px; }
.md li .actions button:hover { border-color: var(--acc); }
.md p { margin: 6px 0; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--code); }
.md pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; }
.md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--line); color: var(--dim); }
.md p.lead { font-size: 15.5px; line-height: 1.7; color: #e9f1f8; margin: 4px 0 16px; }
.facts { display: grid; gap: 7px; margin: 0 0 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(180deg, #111a24, #0e161f); }
.frow { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.pill { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pill.txt { background: none; border-color: #1c2a38; color: var(--code); cursor: default; white-space: normal; }
.flabel { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; padding-top: 3px; }
.fvals, .pills { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 7px; border-radius: 99px; background: #15212d; border: 1px solid #1f3042; color: var(--ink); text-decoration: none; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.pill i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.pill:hover { border-color: var(--acc); background: #17302b; }
.pill.unresolved { color: var(--dim); border-style: dashed; }
.mini-label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.callout { margin: 10px 0; border: 1px solid var(--line); border-radius: 10px; background: #0f1720; overflow: hidden; }
.callout .co-head { padding: 7px 12px; cursor: pointer; color: var(--code); font-size: 13px; list-style: none; display: flex; gap: 8px; align-items: center; }
.callout .co-head::-webkit-details-marker { display: none; }
details.callout .co-head::before { content: "▸"; color: var(--dim); transition: transform .15s; }
details.callout[open] .co-head::before { transform: rotate(90deg); }
.callout > ul, .callout > p { margin: 0; padding: 4px 14px 10px 30px; }
.callout > p.pills { padding-left: 14px; }
.co-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border-radius: 5px; background: var(--track); color: var(--dim); }
.co-unverified { border-color: #4a3d22; } .co-unverified .co-kind { background: #2a2414; color: var(--run); }
.co-pending { border-color: #3d2e55; background: #15111d; } .co-pending .co-kind { background: #251a33; color: #c9a0ff; }
.md li.task { list-style: none; margin-left: -18px; }
.md li.task input { accent-color: var(--acc); margin-right: 4px; }
.md li.task.done { color: var(--dim); text-decoration: line-through; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 6px 0 18px; }
.thumb { display: block; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel2); cursor: pointer; text-decoration: none; }
.thumb:hover { border-color: var(--acc); }
.thumb svg { display: block; width: 100%; height: auto; }
.thumb span { display: block; padding: 3px 7px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.pending { opacity: .6; }
.aka { color: var(--dim); font-size: 12px; margin: -4px 0 12px; }
.aka b { color: var(--code); font-weight: 500; }
.ctx-card { margin: 0 0 18px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 12px; }
.ctx-card h4 { margin: 0 0 6px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; }
.preview-card h2 { margin: 2px 0 2px; font-size: 18px; }
.preview-card .md p.lead { font-size: 13px; }
.preview-card .frow { grid-template-columns: 74px minmax(0, 1fr); }
.preview-card .facts { padding: 9px 10px; }
@media (max-width: 1450px) { .vault { grid-template-columns: 44px 240px 1fr 290px; } }
@media (max-width: 1180px) { .vault { grid-template-columns: 44px 220px 1fr; } .vault > .right { display: none; } }
.md .em-dim { color: var(--dim); font-style: italic; }
.wl { color: var(--sky); text-decoration: none; cursor: pointer; border-radius: 3px; }
.wl:hover { text-decoration: underline; }
.wl.unresolved { color: #6d87a3; opacity: .8; }
.tag { color: var(--acc); background: #12302a; border-radius: 4px; padding: 0 4px; cursor: pointer; font-size: 12px; }
.tag.t-unverified { color: var(--run); background: #2a2414; }
.tag.t-pending { color: #c9a0ff; background: #251a33; }
.embed { margin: 8px 0 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel2); }
.embed svg { display: block; width: 100%; height: auto; }
.embed .cap { padding: 5px 10px; font-size: 11px; color: var(--dim); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.long-note { margin: 10px 0; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; color: var(--dim); font-size: 12px; }

.editor { width: 100%; min-height: 60vh; resize: vertical; padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel2); color: var(--ink); font: 13px/1.6 var(--mono); outline: none; tab-size: 2; }
.editor:focus { border-color: var(--acc); }
.edit-bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--dim); font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 7px; padding: 4px 12px; }
.btn:hover { border-color: var(--acc); }
.btn.primary { background: #17302b; border-color: #23584c; color: var(--ink); }
.btn.danger { border-color: #5b3036; color: var(--bad); }
.ac { position: absolute; z-index: 30; width: 300px; max-height: 240px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.ac div { padding: 4px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac div small { color: var(--dim); margin-left: 6px; }
.ac div.sel, .ac div:hover { background: #17302b; }

/* ---- right sidebar */
.rtabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
.rtabs button { border: 0; background: none; color: var(--dim); padding: 6px 9px; border-radius: 7px 7px 0 0; font-size: 12px; }
.rtabs button.on { color: var(--ink); background: var(--bg); box-shadow: inset 0 -2px var(--acc); }
.rbody { padding: 10px 12px 20px; }
.rsec { margin-bottom: 14px; }
.rsec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); display: flex; }
.rsec h4 span { margin-left: auto; }
.bl { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--panel2); }
.bl .src { padding: 5px 9px; font-weight: 600; cursor: pointer; display: flex; gap: 6px; }
.bl .src:hover { color: var(--sky); }
.bl .src small { margin-left: auto; color: var(--dim); font-weight: 400; }
.bl .ctx { padding: 3px 9px 6px; font-size: 12px; color: var(--code); border-top: 1px solid #18222e; }
.outline div { padding: 2px 6px; border-radius: 5px; cursor: pointer; display: flex; }
.outline div:hover { background: var(--hover); }
.outline small { margin-left: auto; color: var(--dim); }
.rev { display: grid; grid-template-columns: 10px 1fr; gap: 8px; padding: 6px 4px; border-radius: 7px; cursor: pointer; }
.rev:hover, .rev.sel { background: var(--hover); }
.rev .pip { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: var(--dim); }
.rev .who { font-size: 12px; font-weight: 600; }
.rev .what { font-size: 12px; color: var(--code); }
.rev .when { font-size: 11px; color: var(--dim); }
.actor-migration .pip { background: #6d87a3; }
.actor-you .pip { background: var(--acc); }
.actor-writer .pip { background: var(--sky); }
.actor-tidy .pip { background: #c9a0ff; }
.actor-intake .pip { background: var(--run); }
.local-graph { width: 100%; height: 300px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel2); display: block; }
.lg-ctl { display: flex; gap: 8px; align-items: center; margin: 6px 0; color: var(--dim); font-size: 12px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: var(--panel2); }
.stat b { display: block; font-size: 16px; }
.stat small { color: var(--dim); font-size: 11px; }

/* ---- diff */
.diff { font: 12px/1.55 var(--mono); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel2); }
.diff div { padding: 0 10px; white-space: pre-wrap; word-break: break-word; }
.diff .add { background: #12291f; color: #a5e7c3; }
.diff .add::before { content: "+ "; color: var(--ok); }
.diff .del { background: #2c1519; color: #f2b3b3; }
.diff .del::before { content: "- "; color: var(--bad); }
.diff .ctx::before { content: "  "; }
.diff .ctx { color: var(--dim); }
.diff .gap { color: #4b6178; background: #0f1720; text-align: center; }
.diff-head { display: flex; gap: 10px; align-items: center; margin: 0 0 12px; }
.diff-head h2 { margin: 0; font-size: 18px; flex: 1; }

/* ---- graph view */
.graph-wrap { position: absolute; inset: 0; background: radial-gradient(ellipse at 45% 50%, #13202c 0%, #0e141b 65%); }
.graph-wrap canvas { width: 100%; height: 100%; display: block; cursor: grab; }
.graph-ctl { position: absolute; top: 12px; right: 12px; width: 250px; background: rgba(18,26,35,.94); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; }
.graph-ctl h4 { margin: 8px 0 4px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.graph-ctl input[type=text] { width: 100%; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); }
.graph-ctl label { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
.graph-ctl .legend label { cursor: pointer; }
.graph-ctl .legend small { margin-left: auto; color: var(--dim); }
.graph-ctl input[type=range] { width: 100%; }
.graph-info { position: absolute; left: 12px; bottom: 12px; color: var(--dim); font-size: 11px; background: rgba(11,17,24,.8); padding: 4px 8px; border-radius: 6px; }

/* ---- status bar, palette, hover preview, toast */
.status { display: flex; align-items: center; gap: 16px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--panel2); color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; }
.status b { color: var(--ink); font-weight: 600; }
.status .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--run); margin-right: 5px; }
.status .grow { flex: 1; }
.status button { border: 1px solid var(--line); background: none; border-radius: 5px; padding: 0 8px; color: var(--code); }
.status button:hover { border-color: var(--acc); }
.palette-bg { position: fixed; inset: 0; background: rgba(4,8,12,.55); display: none; z-index: 50; }
.palette-bg.open { display: block; }
.palette { width: 580px; margin: 12vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6); overflow: hidden; }
.palette input { width: 100%; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; outline: none; font-size: 15px; }
.palette .list { max-height: 52vh; overflow: auto; }
.palette .item { padding: 6px 14px; display: flex; gap: 8px; cursor: pointer; }
.palette .item small { color: var(--dim); margin-left: auto; }
.palette .item.sel { background: #17302b; }
.palette .hint { padding: 6px 14px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line); }
.hover-card { position: fixed; z-index: 40; width: 420px; max-height: 340px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 16px 50px rgba(0,0,0,.55); padding: 10px 14px; display: none; pointer-events: none; }
.hover-card h1 { font-size: 16px; margin: 0 0 4px; }
.hover-card .md { font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: #17302b; border: 1px solid #23584c; padding: 8px 14px; border-radius: 9px; display: none; z-index: 60; max-width: 640px; }
.empty { color: var(--dim); padding: 30px; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Sift<b>Kit</b></div>
    <button class="tab">Chat</button><button class="tab">Runs</button><button class="tab">Metrics</button>
    <button class="tab active">Memory</button><button class="tab">Benchmark</button><button class="tab">Settings</button>
    <div class="spacer"></div>
    <span class="mock-flag" id="mockFlag">mockup · real data snapshot · nothing is saved</span>
  </header>
  <div class="vault">
    <nav class="ribbon">
      <button data-side="files" class="active" title="Files">🗂</button>
      <button data-side="search" title="Search (Ctrl+Shift+F)">⌕</button>
      <button data-side="tags" title="Tags">#</button>
      <button id="rbGraph" title="Graph view">◎</button>
      <button id="rbDaily" title="Today's daily note">☀</button>
      <button id="rbReview" title="Review unverified facts">✓</button>
      <div class="grow"></div>
      <button id="rbNew" title="New note">＋</button>
      <button id="rbSwitch" title="Quick switcher (Ctrl+O)">⌘</button>
    </nav>
    <aside class="left">
      <div class="pane-head"><h3 id="leftTitle">Vault</h3>
        <button class="icon-btn" id="collapseAll" title="Collapse all">⊟</button></div>
      <div class="search"><input id="searchInput" placeholder="Search notes…  (tag:#unverified, path:Software)" /></div>
      <div class="scroll" id="leftBody"></div>
    </aside>
    <main class="center">

// A scripted tidy-pass revision on one note, to show what the background LLM rewrite looks like in history.

let index; // title/alias → note, rebuilt after edits
function rebuildIndex() {

}
const LINK_RE = /(!?)\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g;

    const outs = new Set();

      for (const m of line.matchAll(LINK_RE)) {
        if (m[1]) continue;
        const target = index.get(m[2].trim().toLowerCase());

const degree = (n) => (outLinks.get(n.id)?.size ?? 0) + new Set((backLinks.get(n.id) ?? []).map((b) => b.from)).size;

const versionText = (n, k) => n.revs[k].snapshot;
function commit(n, text, actor, summary) {

/* ---------------------------------------------------------------- markdown */
// Custom renderer for the vault dialect: lead paragraph, **Label** fact rows, foldable callouts,
// task lists, and image embeds (consecutive embeds become a thumbnail grid).
function inline(s, ctx) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  out = out.replace(/(^|[\s(])_([^_]+)_(?=$|[\s.,)])/g, '$1<span class="em-dim">$2</span>');
  out = out.replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (_, target, label) => {
    const t = target.trim();
    const hit = index.get(unesc(t).toLowerCase());
    if (ctx?.pills) return `<a class="pill${hit ? '' : ' unresolved'}" data-link="${t}"><i style="background:${hit ? colorOf(hit) : '#3a4c61'}"></i>${label ?? t}</a>`;
    return `<a class="wl${hit ? '' : ' unresolved'}" data-link="${t}">${label ?? t}</a>`;
  });
  out = out.replace(/(^|\s)#([a-z][\w/-]*)/gi, (_, sp, tag) => `${sp}<span class="tag t-${tag.toLowerCase()}" data-tag="${tag.toLowerCase()}">#${tag}</span>`);
  if (ctx?.highlight) out = highlight(out, ctx.highlight);

}
// A " · "-separated value list: links become pills, plain values become text pills.

}
const unesc = (s) => s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");

    if (li) { if (!list) { html.push('<ul>'); list = true; } html.push(renderListItem(li[1], i, opts)); continue; }

}

}

  return `<svg viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="340" fill="hsl(${hue} 22% 10%)"/>
  <rect width="800" height="30" fill="hsl(${hue} 20% 15%)"/><circle cx="18" cy="15" r="5" fill="#ef7d7d"/><circle cx="34" cy="15" r="5" fill="#e6b566"/><circle cx="50" cy="15" r="5" fill="#4fca8f"/>
  <text x="400" y="20" fill="#879bb0" font-size="12" text-anchor="middle" font-family="Segoe UI">${esc((cap.window || cap.app).slice(0, 90))}</text>
  <rect x="0" y="30" width="180" height="310" fill="hsl(${hue} 18% 13%)"/>${Array.from({ length: 8 }, (_, i) => `<rect x="18" y="${54 + i * 26}" width="${90 + ((i * 53) % 60)}" height="8" rx="3" fill="hsl(${hue} 15% 26%)"/>`).join('')}

/* ---------------------------------------------------------------- state */
const state = {
  tabs: [], active: -1, // tab: { kind: 'note'|'graph'|'diff'|'review', noteId?, rev? , mode?: 'read'|'edit', full? }
  side: 'files', right: 'graph', search: '', expanded: new Set(['Daily']),

const activeTab = () => state.tabs[state.active] ?? null;
const activeNote = () => { const t = activeTab(); return t && t.noteId !== undefined ? notes[t.noteId] : null; };

function openNote(n, { newTab = false, mode = 'read' } = {}) {
  const existing = state.tabs.findIndex((t) => t.kind === 'note' && t.noteId === n.id);
  if (existing >= 0) state.active = existing;
  else if (!newTab && activeTab()?.kind === 'note' && activeTab().mode !== 'edit') state.tabs[state.active] = { kind: 'note', noteId: n.id, mode };

}

/* ---------------------------------------------------------------- left pane */
function renderLeft() {

}
function buildTree() {

    if (n.folder) for (const part of n.folder.split('/')) {
      if (!node.children.has(part)) node.children.set(part, { name: part, children: new Map(), notes: [], path: node.path ? `${node.path}/${part}` : part });

function renderTree() {
  const root = buildTree();

  const starred = [notes.find((n) => n.tags.includes('me')), notes.find((n) => n.title === 'SiftKit'), today].filter(Boolean);

      return;
    }
    const sorted = [...t.notes].sort((a, b) => (t.name === 'Daily' || t.path?.startsWith('Captures') ? b.title.localeCompare(a.title) : degree(b) - degree(a) || a.title.localeCompare(b.title)));

    if (!filters.every(([k, v]) => (k === 'tag' ? tagIndex.get(v)?.has(n.id) : k === 'path' ? n.path.toLowerCase().startsWith(v) : n.types.some((t) => t.includes(v))))) continue;
    if (!q) { hits.push({ n, score: 1, snippet: '' }); continue; }
    const title = n.title.toLowerCase();

/* ---- computed "where it shows up" card for notes with no facts of their own */
function backlinkLabel(line) {
  const l = line.replace(/^>\s*/, '').replace(/^\s*-\s*/, '');

}
function renderContextCard(n) {
  const groups = new Map();

    const label = backlinkLabel(b.line);
    if (!groups.has(label)) groups.set(label, new Set());
    groups.get(label).add(b.from);
  }
  if (groups.size === 0) return '';
  const rows = [...groups.entries()].sort((a, b) => b[1].size - a[1].size).map(([label, ids]) =>
    `<div class="frow"><span class="flabel">${esc(label)} ←</span><span class="fvals">${[...ids].slice(0, 12).map((id) => inline(`[[${notes[id].title}]]`, { pills: true })).join('')}${ids.size > 12 ? `<small style="color:var(--dim)">+${ids.size - 12}</small>` : ''}</span></div>`);
  return `<div class="ctx-card"><h4>Where it shows up</h4><div class="facts" style="margin:0;border:0;background:none;padding:0">${rows.join('')}</div></div>`;
}

/* ---- editor with [[ autocomplete */
function wireEditor(n) {
  const ed = $('#editor');
  ed.focus();
  let ac = null, acItems = [], acSel = 0;
  const closeAc = () => { ac?.remove(); ac = null; };
  const update = () => {
    const before = ed.value.slice(0, ed.selectionStart);
    const m = before.match(/\[\[([^\]\n]*)$/);
    if (!m) return closeAc();
    const qq = m[1].toLowerCase();
    acItems = notes.filter((x) => x.title.toLowerCase().includes(qq) || x.aliases.some((a) => a.toLowerCase().includes(qq)))
      .sort((a, b) => (a.title.toLowerCase().startsWith(qq) ? 0 : 1) - (b.title.toLowerCase().startsWith(qq) ? 0 : 1) || degree(b) - degree(a)).slice(0, 12);
    if (!ac) { ac = document.createElement('div'); ac.className = 'ac'; ed.parentElement.appendChild(ac); }
    acSel = Math.min(acSel, Math.max(0, acItems.length - 1));
    ac.style.left = `${ed.offsetLeft + 20}px`; ac.style.top = `${ed.offsetTop + 30}px`;
    ac.innerHTML = acItems.length ? acItems.map((x, i) => `<div class="${i === acSel ? 'sel' : ''}" data-i="${i}">${esc(x.title)}<small>${esc(x.folder)}</small></div>`).join('') : `<div>Create “${esc(m[1])}”</div>`;
    ac.onmousedown = (e) => { const i = e.target.closest('[data-i]')?.dataset.i; if (i !== undefined) { e.preventDefault(); pick(acItems[+i]); } };
  };
  const pick = (x) => {
    const pos = ed.selectionStart;
    const before = ed.value.slice(0, pos).replace(/\[\[([^\]\n]*)$/, `[[${x.title}]]`);
    ed.value = before + ed.value.slice(pos).replace(/^\]\]/, '');
    ed.selectionStart = ed.selectionEnd = before.length;
    closeAc();
  };
  ed.addEventListener('input', update);
  ed.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
    if (!ac || !acItems.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); acSel = (acSel + 1) % acItems.length; update(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); acSel = (acSel - 1 + acItems.length) % acItems.length; update(); }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pick(acItems[acSel]); }
    if (e.key === 'Escape') closeAc();
  });
  const save = () => {
    if (ed.value !== n.text) { commit(n, ed.value, 'you', 'Edited in the vault'); toast('Saved. One transaction wrote the note, its revision, and the link/tag index.'); }
    activeTab().mode = 'read'; renderAll();
  };
  $('#saveEdit').onclick = save;
  $('#cancelEdit').onclick = () => { activeTab().mode = 'read'; renderAll(); };
}

/* ---- rename (rewrites every inbound link in one transaction) */
function renameNote(n, next) {
  next = next.replace(/[\\/:*?"<>|#^[\]]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!next || next === n.title) return;
  if (index.get(next.toLowerCase()) && index.get(next.toLowerCase()) !== n) { toast(`A note called “${next}” already exists.`); return; }
  const old = n.title;
  const re = new RegExp(`\\[\\[${old.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}(#[^\\]|]*)?(\\|[^\\]]+)?\\]\\]`, 'gi');
  let links = 0, touched = 0;
  for (const other of notes) {
    if (other === n) continue;
    let count = 0;
    const text = other.text.replace(re, (_, h, l) => { count += 1; return `[[${next}${h ?? ''}${l ?? ''}]]`; });
    if (count) { links += count; touched += 1; other.text = text; other.revs.push({ at: new Date().toISOString(), actor: 'you', summary: `Link updated: ${old} → ${next}`, snapshot: text }); }
  }
  n.aliases = [...new Set([old, ...n.aliases])];
  n.title = next; n.path = n.folder ? `${n.folder}/${next}` : next;
  n.revs.push({ at: new Date().toISOString(), actor: 'you', summary: `Renamed from “${old}” (kept as alias)`, snapshot: n.text });
  rebuildIndex(); rebuildLinks();
  toast(`Renamed. ${links} links in ${touched} notes rewritten atomically; “${old}” kept as an alias.`);
  renderAll();
}

/* ---- unverified fact triage (inline ✓ / ✕) */
// Keep moves the fact out of the unverified callout into its fact row; drop deletes it. One revision either way.
function triage(n, lineNo, act) {
  const lines = n.text.split('\n');
  const line = lines[lineNo];
  if (!line) return;
  const fact = line.replace(/^>?\s*-\s*/, '').replace(/\s*#unverified\b/, '');
  lines.splice(lineNo, 1);
  if (act === 'confirm') {
    const row = fact.match(FACT_ROW);
    const label = row ? row[1] : 'Facts', value = row ? row[2] : fact;
    const existing = lines.findIndex((l) => l.startsWith(`**${label}** `));
    if (existing >= 0) lines[existing] += ` · ${value}`;
    else {
      const lastRow = lines.reduce((acc, l, i) => (FACT_ROW.test(l) ? i : acc), -1);
      lines.splice(lastRow >= 0 ? lastRow + 1 : Math.min(2, lines.length), 0, `**${label}** ${value}`);
    }
  }
  n.unverified = Math.max(0, (n.unverified ?? 1) - 1);
  const head = lines.findIndex((l) => /^> \[!unverified\]-?\s*\d+/.test(l));
  if (head >= 0) {
    if (n.unverified === 0) lines.splice(head, 1);
    else lines[head] = `> [!unverified]- ${n.unverified} unverified fact${n.unverified === 1 ? '' : 's'}`;
  }
  commit(n, lines.join('\n'), 'you', `${act === 'confirm' ? 'Kept' : 'Dropped'}: ${fact.replace(/\*\*/g, '')}`);
  renderAll();
}
function renderFactInline(text) {

}
function renderReview() {

  }

/* ---- diff */
function lineDiff(a, b) {
  let s = 0;
  while (s < a.length && s < b.length && a[s] === b[s]) s += 1;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && a[ea - 1] === b[eb - 1]) { ea -= 1; eb -= 1; }
  const A = a.slice(s, ea), B = b.slice(s, eb);
  const ops = a.slice(0, s).map((t) => ['ctx', t]);
  if (A.length * B.length > 4_000_000) { ops.push(...A.map((t) => ['del', t]), ...B.map((t) => ['add', t])); }
  else {
    const dp = Array.from({ length: A.length + 1 }, () => new Uint16Array(B.length + 1));
    for (let i = A.length - 1; i >= 0; i -= 1) for (let j = B.length - 1; j >= 0; j -= 1) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0;
    while (i < A.length || j < B.length) {
      if (i < A.length && j < B.length && A[i] === B[j]) { ops.push(['ctx', A[i]]); i += 1; j += 1; }
      else if (j < B.length && (i >= A.length || dp[i][j + 1] >= dp[i + 1][j])) { ops.push(['add', B[j]]); j += 1; }
      else { ops.push(['del', A[i]]); i += 1; }
    }
  }
  ops.push(...a.slice(ea).map((t) => ['ctx', t]));
  return ops;
}
function renderDiff(n, k) {
  const before = k === 0 ? [] : versionText(n, k - 1).split('\n');
  const after = versionText(n, k).split('\n');
  const ops = lineDiff(before, after);
  const keep = new Set();
  ops.forEach(([kind], i) => { if (kind !== 'ctx') for (let d = -3; d <= 3; d += 1) keep.add(i + d); });
  const out = [];
  let gap = false;
  ops.forEach(([kind, t], i) => {
    if (k > 0 && !keep.has(i)) { if (!gap) { out.push('<div class="gap">⋯</div>'); gap = true; } return; }
    gap = false;
    out.push(`<div class="${kind}">${esc(t) || ' '}</div>`);
  });
  const added = ops.filter((o) => o[0] === 'add').length, removed = ops.filter((o) => o[0] === 'del').length;
  const rev = n.revs[k];
  const src = rev.evId ? notes.find((x) => x.capture?.evId === rev.evId) : null;
  return `<article class="note" style="max-width:980px"><div class="crumbs"><span>${esc(n.title)}</span><span class="sep">/</span><span>history</span></div>
    <div class="diff-head"><h2>r${k + 1} · ${esc(rev.actor)}</h2>
    <button class="btn" data-open="${n.id}">Open note</button>
    ${k < n.revs.length - 1 ? `<button class="btn danger" data-restore="${n.id}:${k}">Restore this version</button>` : '<span class="chip">current</span>'}</div>
    <p style="color:var(--dim);margin-top:-6px">${fmtTime(rev.at)} · ${esc(rev.summary)} · <span style="color:var(--ok)">+${added}</span> <span style="color:var(--bad)">−${removed}</span>${src ? ` · source <a class="wl" data-link="${esc(src.title)}">${esc(src.title)}</a>` : ''}</p>
    <div class="diff">${out.join('')}</div></article>`;
}

function renderOutline(n) {

/* ---------------------------------------------------------------- force graph (shared by global + local) */
function makeSim(nodes, edges) {
  // Phyllotaxis seeding (densest nodes in the middle) converges far faster than random placement.
  const order = [...nodes].sort((p, q) => q.deg - p.deg);
  order.forEach((n, i) => { const r = 12 * Math.sqrt(i + 0.5), t = i * 2.39996; n.x ??= r * Math.cos(t); n.y ??= r * Math.sin(t); n.vx = 0; n.vy = 0; });

  sim.tick = () => {
    const a = sim.alpha, cell = 110, grid = new Map();
    for (const n of nodes) { const k = `${Math.floor(n.x / cell)},${Math.floor(n.y / cell)}`; (grid.get(k) ?? grid.set(k, []).get(k)).push(n); }
    for (const n of nodes) {
      const cx = Math.floor(n.x / cell), cy = Math.floor(n.y / cell);
      for (let dx = -1; dx <= 1; dx += 1) for (let dy = -1; dy <= 1; dy += 1) for (const m of grid.get(`${cx + dx},${cy + dy}`) ?? []) {
        if (m === n) continue;
        let x = n.x - m.x, y = n.y - m.y, d2 = x * x + y * y;
        if (d2 > cell * cell) continue;
        if (d2 === 0) { x = Math.random() - 0.5; y = Math.random() - 0.5; }
        d2 = Math.max(d2, 25);
        const f = (60 * a) / d2;
        n.vx += x * f; n.vy += y * f;
      }
      n.vx -= n.x * 0.008 * a; n.vy -= n.y * 0.008 * a;
    }

      const s = e.s, t = e.t;
      let x = t.x + t.vx - s.x - s.vx, y = t.y + t.vy - s.y - s.vy;
      const d = Math.sqrt(x * x + y * y) || 1;
      const l = ((d - 40) / d) * a * (0.5 / Math.max(1, Math.min(s.deg, t.deg)));
      x *= l; y *= l;

      t.vx -= x * bias; t.vy -= y * bias; s.vx += x * (1 - bias); s.vy += y * (1 - bias);
    }

      if (n.fixed) { n.vx = n.vy = 0; continue; }
      n.vx = Math.max(-30, Math.min(30, n.vx * 0.6)); n.vy = Math.max(-30, Math.min(30, n.vy * 0.6));

}

// Fit the laid-out graph into the visible canvas, leaving room for an overlay panel on the right.
function fitView(sim, r, v, reserveRight = 0) {

function buildGraph(filterNotes, current) {
  const ids = new Set(filterNotes.map((n) => n.id));

  const edges = [];

    if (!ids.has(t)) continue;

    if (seen.has(key)) continue;

    const src = notes[+linkify.dataset.linkify], target = activeNote();
    const re = new RegExp(`(?<!\\[\\[)\\b(${target.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})\\b(?!\\]\\])`, 'i');
    commit(src, src.text.replace(re, `[[${target.title}]]`), 'you', `Linked mention of ${target.title}`);
    toast(`Linked the mention in “${src.title}”.`); return renderAll();
  }
  const wl = el.closest('[data-link]'); if (wl) { $('#hoverCard').style.display = 'none'; return followLink(wl.dataset.link, e.ctrlKey || e.metaKey); }
  const tag = el.closest('[data-tag]'); if (tag) { state.search = `tag:#${tag.dataset.tag}`; $('#searchInput').value = state.search; return renderLeft(); }
  const srch = el.closest('[data-search]'); if (srch) { state.search = srch.dataset.search; $('#searchInput').value = state.search; return renderLeft(); }
  const folder = el.closest('[data-folder]'); if (folder) { const f = folder.dataset.folder; state.expanded.has(f) ? state.expanded.delete(f) : state.expanded.add(f); return renderLeft(); }
  const noteEl = el.closest('[data-note]'); if (noteEl) return openNote(notes[+noteEl.dataset.note], { newTab: e.ctrlKey || e.metaKey });
  const rev = el.closest('[data-rev]'); if (rev) { const [id, k] = rev.dataset.rev.split(':').map(Number); return openSpecial('diff', { noteId: id, rev: k }); }
  const restore = el.closest('[data-restore]');
  if (restore) { const [id, k] = restore.dataset.restore.split(':').map(Number); const n = notes[id]; commit(n, versionText(n, k), 'you', `Restored r${k + 1}`); toast(`Restored r${k + 1} as a new revision; nothing was deleted from history.`); return openNote(n); }
  const open = el.closest('[data-open]'); if (open) return openNote(notes[+open.dataset.open]);
  const mode = el.closest('[data-mode]'); if (mode) { activeTab().mode = mode.dataset.mode; return renderAll(); }
  const jump = el.closest('[data-jump]'); if (jump) { activeTab().full = true; renderCenter(); $(`#h-${jump.dataset.jump}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const rt = el.closest('#rtabs [data-r]'); if (rt) { state.right = rt.dataset.r; return renderRight(); }
  const side = el.closest('.ribbon [data-side]'); if (side) { state.side = side.dataset.side; if (state.side !== 'search') { state.search = ''; $('#searchInput').value = ''; } else $('#searchInput').focus(); return renderLeft(); }
  const pi = el.closest('[data-pi]'); if (pi) return palettePick(pi.dataset.pi === 'new' ? 'new' : +pi.dataset.pi);
  if (el.id === 'paletteBg') return closePalette();
  if (el.id === 'noteTitle' && activeTab()?.kind === 'note') {
    el.contentEditable = 'true'; el.focus();
    const n = activeNote();
    el.onblur = () => { el.contentEditable = 'false'; renameNote(n, el.textContent); };
    el.onkeydown = (k) => { if (k.key === 'Enter') { k.preventDefault(); el.blur(); } if (k.key === 'Escape') { el.textContent = n.title; el.blur(); } };
  }
});
document.addEventListener('mouseover', (e) => {
  const wl = e.target.closest?.('.view [data-link], .rbody [data-link]');
  clearTimeout(hoverTimer);
  if (!wl) { $('#hoverCard').style.display = 'none'; return; }
  hoverTimer = setTimeout(() => showHover(wl), 350);
});
$('#searchInput').addEventListener('input', (e) => { state.search = e.target.value; renderLeft(); });
$('#collapseAll').onclick = () => { state.expanded.clear(); renderLeft(); };
$('#rbGraph').onclick = () => openSpecial('graph');
$('#rbReview').onclick = () => openSpecial('review');
$('#rbDaily').onclick = () => { const d = [...notes].filter((n) => n.folder === 'Daily').sort((a, b) => b.title.localeCompare(a.title))[0]; if (d) openNote(d, { newTab: true }); };
$('#rbNew').onclick = () => { let i = 1; while (index.get(`untitled ${i}`)) i += 1; openNote(createNote(`Untitled ${i}`, ''), { mode: 'edit', newTab: true }); };
$('#rbSwitch').onclick = openPalette;
$('#paletteInput').addEventListener('input', () => { palSel = 0; renderPalette(); });
$('#paletteInput').addEventListener('keydown', (e) => {
  const max = palItems.length + ($('#paletteList').querySelector('[data-pi="new"]') ? 1 : 0);
  if (e.key === 'ArrowDown') { e.preventDefault(); palSel = (palSel + 1) % Math.max(1, max); renderPalette(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); palSel = (palSel - 1 + max) % Math.max(1, max); renderPalette(); }
  if (e.key === 'Enter') { e.preventDefault(); palettePick(e.shiftKey ? 'new' : palSel); }
  if (e.key === 'Escape') closePalette();
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'k')) { e.preventDefault(); openPalette(); }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); state.side = 'search'; renderLeft(); $('#searchInput').focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e' && activeTab()?.kind === 'note') { e.preventDefault(); activeTab().mode = activeTab().mode === 'edit' ? 'read' : 'edit'; renderAll(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g') { e.preventDefault(); openSpecial('graph'); }
});

/* ---------------------------------------------------------------- boot */
const owner = notes.find((n) => n.tags.includes('me'));
const latestDaily = [...notes].filter((n) => n.folder === 'Daily').sort((a, b) => b.title.localeCompare(a.title))[0];
const sk = notes.find((n) => n.title === 'SiftKit');
// The vault opens on the graph; your own note and today's daily sit in the next tabs.
state.tabs.push({ kind: 'graph' });
for (const n of [owner, sk, latestDaily].filter(Boolean)) { state.tabs.push({ kind: 'note', noteId: n.id, mode: 'read' }); }
state.active = 0;
const params = new URLSearchParams(location.search);
if (params.get('sel')) { const n = index.get(params.get('sel').toLowerCase()); if (n) { state.graphSel = n.id; graphOpts.selected = n.id; } }
if (params.get('view') === 'review') openSpecial('review');
else if (params.get('note')) { const n = index.get(params.get('note').toLowerCase()); if (n) openNote(n, { newTab: true }); else renderAll(); }
else renderAll();
if (params.get('right')) { state.right = params.get('right'); renderRight(); }
if (params.get('rev') && activeNote()) { openSpecial('diff', { noteId: activeNote().id, rev: +params.get('rev') }); }
</script>
</body>
</html>
